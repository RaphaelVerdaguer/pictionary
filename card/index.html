<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tirage de carte</title>
    <link rel="stylesheet" href="../common/styles.css" />
    <link rel="stylesheet" href="../common/boardMini.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="card-page" aria-labelledby="card-title">
      <section class="card-stage" aria-label="Carte Pictionary">
        <div class="flip-card">
          <div class="flip-card-inner is-flipped" id="card">
            <div class="flip-card-front">
              <h1 class="title" id="card-title">PICTIONARY</h1>
              <div class="category yellow">
                <div class="category-content" data-category="yellow"></div>
                <div class="category-title">P, L, A</div>
              </div>
              <div class="category blue">
                <div class="category-content" data-category="blue"></div>
                <div class="category-title">Objet</div>
              </div>
              <div class="category orange">
                <div class="category-content" data-category="orange"></div>
                <div class="category-title">Action</div>
              </div>
              <div class="category green">
                <div class="category-content" data-category="green"></div>
                <div class="category-title">Mot difficile</div>
              </div>
              <div class="category red">
                <div class="category-content" data-category="red"></div>
                <div class="category-title">Defi</div>
              </div>
            </div>
            <div class="flip-card-back">
              <div class="custom-shape" aria-hidden="true"></div>
              <div id="game-board-mini" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </section>

      <aside class="card-panel" aria-label="Controle des cartes">
        <section class="timer-panel" aria-live="polite">
          <h2>Manche</h2>
          <p class="timer-value" id="timer-value">60 s</p>
          <p class="card-status" id="card-status">Chargement des cartes...</p>
          <button class="drawButton primary-action" id="draw-card" type="button" disabled>
            Tirer une carte
          </button>
        </section>

        <section class="card-help" aria-label="Categories">
          <h2>Categories</h2>
          <ul>
            <li><span class="legend-swatch yellow"></span>Personne, lieu, animal</li>
            <li><span class="legend-swatch blue"></span>Objet</li>
            <li><span class="legend-swatch orange"></span>Action</li>
            <li><span class="legend-swatch green"></span>Mot difficile</li>
            <li><span class="legend-swatch red"></span>Defi</li>
          </ul>
          <a class="board-link" href="../board/">Retour au plateau</a>
        </section>
      </aside>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
