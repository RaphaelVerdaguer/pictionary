<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Plateau de Pictionary</title>
    <link rel="stylesheet" href="../common/styles.css" />
    <link rel="stylesheet" href="player.css" />
    <link rel="stylesheet" href="board.css" />
    <link rel="stylesheet" href="dice.css" />
  </head>
  <body>
    <main class="board-page" aria-labelledby="app-title">
      <section class="board-shell" aria-label="Plateau de jeu">
        <div id="game-board-border">
          <div id="game-board">
            <div id="center-piece">
              <span id="app-title">PICTIONARY</span>
              <span class="center-subtitle">Plateau de jeu</span>
            </div>

            <button id="dice" type="button" aria-label="Lancer le de">
              <div class="dice face-1 face" aria-hidden="true">
                <span class="dot"></span>
              </div>
              <div class="dice face-2 face" aria-hidden="true">
                <span class="dot"></span>
                <span class="dot"></span>
              </div>
              <div class="dice face-3 face" aria-hidden="true">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
              </div>
              <div class="face-4 face dice" aria-hidden="true">
                <div class="column">
                  <span class="dot"></span>
                  <span class="dot"></span>
                </div>
                <div class="column">
                  <span class="dot"></span>
                  <span class="dot"></span>
                </div>
              </div>
              <div class="face-5 face dice" aria-hidden="true">
                <div class="column">
                  <span class="dot"></span>
                  <span class="dot"></span>
                </div>
                <div class="column">
                  <span class="dot"></span>
                </div>
                <div class="column">
                  <span class="dot"></span>
                  <span class="dot"></span>
                </div>
              </div>
              <div class="face-6 face dice" aria-hidden="true">
                <div class="column">
                  <span class="dot"></span>
                  <span class="dot"></span>
                  <span class="dot"></span>
                </div>
                <div class="column">
                  <span class="dot"></span>
                  <span class="dot"></span>
                  <span class="dot"></span>
                </div>
              </div>
            </button>

            <div class="player-start-position" id="player-start-position">
              <button
                id="player-0"
                type="button"
                class="player player-0-pos player-0-color selected"
                aria-label="Selectionner joueur 1"
              ></button>
              <button
                id="player-1"
                type="button"
                class="player player-1-pos player-1-color"
                aria-label="Selectionner joueur 2"
              ></button>
              <button
                id="player-2"
                type="button"
                class="player player-2-pos player-2-color"
                aria-label="Selectionner joueur 3"
              ></button>
              <button
                id="player-3"
                type="button"
                class="player player-3-pos player-3-color"
                aria-label="Selectionner joueur 4"
              ></button>
            </div>
          </div>
        </div>
      </section>

      <aside class="game-panel" aria-label="Controle de partie">
        <section class="setup-panel" aria-labelledby="setup-title">
          <h2 id="setup-title">Joueurs</h2>
          <div class="player-count-control" role="radiogroup" aria-label="Nombre de joueurs">
            <label>
              <input type="radio" name="player-count" value="2" checked />
              <span>2</span>
            </label>
            <label>
              <input type="radio" name="player-count" value="3" />
              <span>3</span>
            </label>
            <label>
              <input type="radio" name="player-count" value="4" />
              <span>4</span>
            </label>
          </div>
          <button id="start-game" type="button" class="primary-action">
            Demarrer
          </button>
        </section>

        <section class="status-panel" aria-live="polite" aria-label="Etat de la partie">
          <h2>Partie</h2>
          <dl>
            <div>
              <dt>Joueur actif</dt>
              <dd id="active-player-status">Joueur 1</dd>
            </div>
            <div>
              <dt>Dernier de</dt>
              <dd id="dice-status">6</dd>
            </div>
            <div>
              <dt>Position</dt>
              <dd id="position-status">0 / 54</dd>
            </div>
          </dl>
          <p id="action-status" class="action-status">
            Configurez la partie puis lancez le de.
          </p>
          <button id="next-player" type="button" class="primary-action secondary-action">
            Joueur suivant
          </button>
        </section>

        <section class="phone-panel" aria-label="Cartes sur telephone">
          <h2>Tirer une carte</h2>
          <p class="helper-text">
            Scannez ou clickez sur le QR.
          </p>
          <a
            class="qr-link"
            href="../card/"
            target="_blank"
            rel="noreferrer"
            aria-label="Ouvrir la page des cartes"
          >
            <img id="qr-code" src="../common/qr.svg" alt="QR code vers les cartes" />
          </a>
        </section>

        <section class="legend-panel" aria-label="Categories">
          <h2>Categories</h2>
          <ul>
            <li><span class="legend-swatch yellow"></span>Personne, lieu, animal</li>
            <li><span class="legend-swatch blue"></span>Objet</li>
            <li><span class="legend-swatch orange"></span>Action</li>
            <li><span class="legend-swatch green"></span>Mot difficile</li>
            <li><span class="legend-swatch red"></span>Defi</li>
          </ul>
        </section>
      </aside>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
